<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">TERRA – Die Erde verstehen.</title>
  <desc id="desc">Der dritte DGKN-Atlas. Sechs Perspektiven, 250 Millionen Jahre, vier Expeditionen. Ein dekorativer Globus mit geöffneten Erdschichten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b202b"/><stop offset=".6" stop-color="#193b48"/><stop offset="1" stop-color="#315c68"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#8de0ce" stop-opacity=".16"/><stop offset="1" stop-color="#8de0ce" stop-opacity="0"/></radialGradient>
    <radialGradient id="planet" cx=".25" cy=".2"><stop stop-color="#497786"/><stop offset=".65" stop-color="#234957"/><stop offset="1" stop-color="#112d39"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#d8eeed" stroke-opacity=".04"/></pattern>
    <clipPath id="frame"><rect width="1280" height="380" rx="22"/></clipPath>
    <clipPath id="globe"><circle cx="1037" cy="182" r="133"/></clipPath>
  </defs>
